<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam BG Previewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='steamGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%23171a2e;stop-opacity:1' /><stop offset='50%' style='stop-color:%232a3441;stop-opacity:1' /><stop offset='100%' style='stop-color:%23394455;stop-opacity:1' /></linearGradient><linearGradient id='accentGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%236366f1;stop-opacity:1' /><stop offset='100%' style='stop-color:%234f46e5;stop-opacity:1' /></linearGradient></defs><rect width='100' height='100' fill='url(%23steamGrad)' rx='16'/><rect x='15' y='15' width='70' height='45' fill='url(%23accentGrad)' rx='8' opacity='0.9'/><circle cx='25' cy='75' r='6' fill='url(%23accentGrad)' opacity='0.8'/><circle cx='45' cy='75' r='6' fill='url(%23accentGrad)' opacity='0.8'/><circle cx='65' cy='75' r='6' fill='url(%23accentGrad)' opacity='0.8'/><rect x='75' y='68' width='3' height='14' fill='url(%23accentGrad)' rx='2' opacity='0.8'/><rect x='80' y='65' width='3' height='20' fill='url(%23accentGrad)' rx='2' opacity='0.8'/><rect x='85' y='70' width='3' height='12' fill='url(%23accentGrad)' rx='2' opacity='0.8'/></svg>" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            <h1>Steam BG Previewer</h1>
        </div>
        <div class="badge">
            <span>Demo Tool: Visual preview only</span>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <form id="previewForm">
                <div class="input-group">
                    <label for="profileUrl">Steam Profile URL</label>
                    <div class="input-wrapper">
                        <input 
                            type="url" 
                            id="profileUrl" 
                            placeholder="https://steamcommunity.com/id/username/"
                            required
                            aria-describedby="profile-hint"
                        >
                    </div>
                    <div id="profile-hint" class="input-hint">Must be a public Steam profile</div>
                </div>

                <div class="input-group">
                    <label for="searchInput">Search Backgrounds</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search by title or game..."
                        >
                    </div>
                </div>

                <div class="bg-gallery-section">
                    <label class="gallery-label">
                        <span>Background Gallery</span>
                        <button type="button" id="galleryToggle" class="gallery-toggle" aria-label="Toggle gallery">
                            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6,9 12,15 18,9"></polyline>
                            </svg>
                        </button>
                    </label>
                    <div class="bg-gallery" id="bgGallery">
                        <div class="gallery-loading">Loading backgrounds...</div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" id="btnPreview" class="btn btn-primary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                        <span>Preview</span>
                    </button>
                    
                    <button type="button" id="btnRandom" class="btn btn-secondary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 4L22 8L18 12"/>
                            <path d="M6 20L2 16L6 12"/>
                            <path d="M22 8H12C8.5 8 6 10.5 6 14"/>
                            <path d="M2 16H12C15.5 16 18 13.5 18 10"/>
                        </svg>
                        <span>Random BG</span>
                    </button>
                    
                    <button type="button" id="btnReset" class="btn btn-danger" disabled>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        </svg>
                        <span>Reset</span>
                    </button>
                </div>
            </form>
        </aside>

        <main class="preview-area">
            <div class="preview-card">
                <div class="preview-header">
                    <h2>Profile Preview</h2>
                    <p class="preview-subtitle">Background will be applied with cover sizing to the profile area</p>
                </div>
                
                <div class="preview-content">
                    <div class="iframe-container">
                        <iframe 
                            id="previewFrame" 
                            sandbox="allow-scripts allow-same-origin"
                            title="Steam profile preview"
                        ></iframe>
                        
                        <div class="placeholder" id="placeholder">
                            <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                <line x1="8" y1="21" x2="16" y2="21"/>
                                <line x1="12" y1="17" x2="12" y2="21"/>
                            </svg>
                            <h3>Ready to Preview</h3>
                            <p>Enter your Steam profile URL and select a background from the gallery to see how it looks.</p>
                        </div>

                        <div class="skeleton" id="skeleton">
                            <div class="skeleton-header"></div>
                            <div class="skeleton-content">
                                <div class="skeleton-line"></div>
                                <div class="skeleton-line"></div>
                                <div class="skeleton-line"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast"></div>
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="liveRegion"></div>

    <script src="app.js"></script>
</body>
</html>
